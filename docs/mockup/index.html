                ob: 0, et: { url: '', st: 'idle' }, gcal: false, openMode: 'more', blk: null, grp: [],
                nm: { title: '중간 점검 전 회의', from: '2026-11-16', to: '2026-11-20', len: 120, mode: '상관없음' } };
    let timer = null;
    const LIVE_MS = 3000; // 받아적는 중에 한 줄이 쌓이는 간격(시연용)
    const loadedAt = Date.now();

    const $ = s => document.querySelector(s);
    const P = DATA.project;
    const member = id => DATA.members.find(m => m.id === id);
    const nameOf = id => (id ? member(id).name : '');
    const isLeader = () => S.me === DATA.leader;
    // 11/5: 사람이 고르는 단계가 없다. 합의가 안 되면 판단 에이전트가 불편·양보
    // 점수로 정하고 **바로 확정**하므로 "고르는 중" 상태가 아예 없다.
    // 판단 에이전트가 정한 안: 3라운드 실패면 후보 중에서, 전원 가능한 시간이 없으면 불참안
    const cands = () => S.talk === 'none' ? DATA.absent : DATA.candidates;
    // 지금 잡힌 회의: 조정된 안이 있으면 그 안의 시간·부담·판단을 합의안 위에 덮어쓴다
    const meet = () => S.pick != null ? { ...DATA.meeting, ...cands()[S.pick] } : DATA.meeting;
    const voters = () => DATA.members.filter(x => x.id !== meet().out); // 응답할 사람(불참안에서 빠지는 사람 제외)
    const av = id => `<span class="av">${id ? nameOf(id)[0] : '?'}</span>`; // 이름 글자 하나(김지수 → 지)
    const bar = (p, cls = '', style = '') => `<div class="bar ${cls}" role="img" aria-label="${p}%"${style ? ` style="${style}"` : ''}><i style="width:${p}%"></i></div>`;
    const steps = lv => `<span class="steps" aria-hidden="true">${[0, 1, 2].map(i => `<i class="${i < YIELD_FILL[lv] ? 'on' : ''}"></i>`).join('')}</span>`;
    const ICON = {
      bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 10"/>',
      cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M9 3v4M15 3v4"/>',
      flag: '<path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/>',
      start: '<circle cx="12" cy="12" r="3"/>',
      link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
      repeat: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/>',
      mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
    };
    const ic = (k, cls = 's') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
    const dueN = t => { const [m, d] = t.due.split('/').map(Number); return m * 100 + d; };

    // 확정된 할 일만(회의록 제안은 빠짐). 회의 기록 전 상태면 그 회의에서 나온 것과 자동 완료를 되돌려 보여 준다
    const tasksAll = () => S.fresh || S.noTasks ? [] : DATA.tasks.filter(t => !t.ai).filter(t => S.recorded || t.mtg !== 'm3')
      .map(t => (!S.recorded && t.autoDone === 'm3' && t.status === 'done') ? { ...t, status: 'doing', autoDone: null } : t);
    const meetings = () => S.fresh ? [] : DATA.meetings.filter(m => S.recorded || m.id !== 'm3');
    // 알림은 할 일 데이터에서 바로 나온다: 막힘 = 상태 막힘, 늦음 = 안 끝났는데 기한 지남, 완료 = 회의에서 끝났다고 한 일
    const riskOf = t => t.status === 'blocked' ? '막힘' : t.status !== 'done' && dueN(t) < P.todayN ? '늦음' : t.status === 'done' && t.autoDone ? '완료' : null;
    const risks = () => S.quiet ? [] : tasksAll().map(t => ({ type: riskOf(t), t })).filter(r => r.type)
      .sort((a, b) => RISK_ORDER.indexOf(a.type) - RISK_ORDER.indexOf(b.type));
    // 기한은 '11/20'으로 저장하고 날짜 입력칸에는 2026-11-20으로 넣는다
    const isoOf = due => { if (!due) return ''; const [m, d] = due.split('/'); return `2026-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; };
    const dueOf = iso => (iso ? iso.slice(5).split('-').map(Number).join('/') : '');
    const dueInput = (attrs, due) => `<input class="field num" type="date" value="${isoOf(due)}" ${attrs} aria-label="기한">`;
    const accepted = () => Object.values(S.resp).filter(r => r === '수락').length;
    const left = () => tasksAll().filter(t => t.status !== 'done').length;
    const unread = () => (S.read ? 0 : risks().length + (S.meeting === 'proposed' ? 1 : 0));
    const isPending = s => { const t = DATA.tasks.find(x => x.id === s.task);
      if (!t || s.state || s.kind === 'done') return false; return s.kind === 'new' ? t.ai : true; };
    const counted = s => s.kind === 'new';
    const pendingCount = m => m.sugs.filter(s => counted(s) && isPending(s)).length;
    const pendingAll = () => meetings().reduce((s, m) => s + pendingCount(m), 0);

    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.hidden = false;
      clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
    }
    function ask(o) {
      const d = $('#sheet'), cs = getComputedStyle($('.app'));
      d.style.setProperty('--sheet-point', cs.getPropertyValue('--point'));
      d.style.setProperty('--sheet-on', cs.getPropertyValue('--on-point'));
      $('#sheet-title').textContent = o.title;
      $('#sheet-body').textContent = o.body;
      $('#sheet-irrev').hidden = o.irreversible === false;
      $('#sheet-extra').innerHTML = o.input ? `<input class="field" id="sheet-input" maxlength="40" placeholder="${o.input}" aria-label="${o.label || '이유'}">` : '';
      const ok = $('#sheet-ok'); ok.textContent = o.ok; ok.className = 'btn ' + (o.danger ? 'danger' : 'primary');
      d.returnValue = ''; d.showModal();
      return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'ok' ? ($('#sheet-input')?.value || true) : false), { once: true }));
    }
    function countdown() {
      const total = S.clock ? 30 * 60 : (8 * 24 + 7) * 3600;
      const s = Math.max(0, total - Math.floor((Date.now() - loadedAt) / 1000));
      const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
      const p = n => String(n).padStart(2, '0');
      return `${d ? d + '일 ' : ''}${p(hh)}:${p(mm)}:${p(ss)}`;
    }

    /* ── 처음 들어오기: 시작 → 방 생성하기(팀장 1회) 또는 초대 코드 → 온보딩(조건 네 가지 → 일정 연결 → 준비 완료) ── */
    function welcome() {
      return `<div class="hello"><p class="meta">팀플 에이전트</p><h2>팀원마다 <em>에이전트</em>가<br>하나씩 붙어요</h2>
          <p class="meta">회의 시간은 에이전트끼리 양보하며 잡고, 회의록에서 할 일을 뽑고, 마감 위험을 먼저 알려 줘요.</p>
          <ol class="flow"><li>팀장이 과제 이름·기간·팀원 수로 방을 만들어요</li><li>팀원은 초대 코드로 들어와요</li><li>질문 네 개를 고르고 일정을 연결하면 내 에이전트가 준비돼요</li></ol></div>
        <div class="cta" style="flex-direction:column;margin-top:8px"><button class="btn primary" data-action="go" data-to="create">방 만들기 (팀장)</button>
          <button class="btn" data-action="go" data-to="join">초대 코드로 들어가기</button></div>`;
    }
    // 방 생성하기: 과제 제목·설명·기간·팀원 수 → 방 만들기 → 초대 코드
    function create() {
      const r = S.room;
      if (S.made === 'done') return `<section class="sec"><h2>방을 만들었어요</h2><p class="meta">팀원에게 이 코드를 보내 주세요</p>
          <div class="row-between" style="margin-top:8px"><span class="code num">${P.code}</span><button class="pill go" data-action="toast" data-msg="초대 링크를 복사했어요">링크 복사</button></div></section>
        <div class="cta"><button class="btn primary" data-action="ob-start">다음: 내 조건 알려 주기</button></div>`;
      return `<section class="sec">
          <label class="field-l">과제 제목 (방 이름)<input class="field" value="${r.name}" data-action="room" data-k="name"></label>
          <label class="field-l">과제 설명<textarea class="field" rows="3" style="min-height:76px" data-action="room" data-k="desc" placeholder="무엇을 만들고 어떻게 평가받는지 두세 줄로 써 주세요">${r.desc}</textarea></label>
          <span class="field-l">기간</span>
          <div class="range"><input class="field num" type="date" value="${r.start}" data-action="room" data-k="start" aria-label="시작일"><span>–</span>
            <input class="field num" type="date" value="${r.end}" data-action="room" data-k="end" aria-label="마감일"></div>
          <span class="field-l">팀원 수</span>
          <div class="seg">${[2, 3, 4, 5, 6].map(n => `<button class="num" data-action="room-size" data-v="${n}" aria-pressed="${r.size === n}">${n}명</button>`).join('')}</div></section>
        <p class="meta" style="margin:10px 18px 0">방을 만든 사람이 팀장이 되고, 회의 잡기는 팀장만 할 수 있어요.</p>
        <div class="cta"><button class="btn primary" data-action="room-make">방 만들기</button></div>`;
    }
    function join() {
      return `<section class="sec"><label class="field-l">초대 코드<input class="field num" value="${P.code}" aria-label="초대 코드"></label>
          <div class="note" style="margin-top:12px"><p class="strong">${P.name}</p><p class="meta">팀장 ${nameOf(DATA.leader)} · ${DATA.members.length - 1}명 참여 중 · 마감 ${P.deadline}</p></div></section>
        <div class="cta"><button class="btn primary" data-action="join-ok">이 방에 들어가기</button></div>`;
    }
    const WHEN = ['아침', '오전', '점심', '오후', '저녁', '밤'];
    const eun = s => ((s.charCodeAt(s.length - 1) - 0xAC00) % 28 ? '은' : '는'); // 받침 있으면 '은'
    // 에이전트 말: 조건 네 가지를 정해진 틀에 그대로 끼워 만든다(조건마다 한 문장)
    function quoteText(p, my) {
      const mode = { '대면': '대면으로 만나요', '비대면': '비대면으로 만나요', '상관없음': '대면·비대면 모두 괜찮아요' }[p.mode];
      return `“${my.name}${eun(my.name)} <em>${p.from}시–${p.to}시</em> 사이에 회의할 수 있어요. <em>${mode}</em>. <em>${p.when.join('·')}</em>${eun(p.when.at(-1))} 좋아요.${p.avoid ? ` 피하고 싶은 시간은 <em>‘${p.avoid}’</em>라고 했어요. 팀원에게는 이 말을 그대로 보여 주지 않고 다듬어서 조율 근거로 써요.` : ''}”`;
    }
    // 내가 직접 고친 문장(S.quote)이 있으면 그걸로 말한다. 고치기 칸에는 꾸밈 없는 글자만 넣는다
    const myQuote = () => S.quote ? `“${S.quote}”` : quoteText(S.pref, member(S.me));
    const quotePlain = () => S.quote || quoteText(S.pref, member(S.me)).replace(/<[^>]+>/g, '').replace(/[“”]/g, '');
    // Component: PrefForm (온보딩 · 나 화면 공통). 세 가지는 선택형, 피하고 싶은 시간만 자연어. 필수는 없다
    function prefForm() {
      const p = S.pref, a = p.avoid;
      const hours = sel => Array.from({ length: 15 }, (_, i) => i + 8).map(h => `<option value="${h}"${h === sel ? ' selected' : ''}>${h}시</option>`).join('');
      const seg = (attr, opts, on) => `<div class="seg">${opts.map(o => `<button ${attr} data-v="${o}" aria-pressed="${on(o)}">${o}</button>`).join('')}</div>`;
      return `<div class="pref" style="padding-top:4px"><span class="meta">몇 시부터 몇 시까지 회의할 수 있어요?</span>
          <div class="range"><select class="field" data-action="pref-sel" data-k="from" aria-label="몇 시부터">${hours(p.from)}</select><span>–</span>
            <select class="field" data-action="pref-sel" data-k="to" aria-label="몇 시까지">${hours(p.to)}</select></div></div>
        <div class="pref"><span class="meta">어떻게 만날까요?</span>${seg('data-action="pref" data-k="mode"', ['대면', '비대면', '상관없음'], o => p.mode === o)}</div>
        <div class="pref"><span class="meta">언제가 좋아요? (여러 개)</span>${seg('data-action="pref-when"', WHEN, o => p.when.includes(o))}</div>
        <div class="pref" style="border-bottom:0"><span class="meta">꼭 피하고 싶은 시간이 있어요? (안 써도 돼요)</span>
          <textarea class="field" rows="2" style="min-height:60px;margin-top:6px" maxlength="80" data-action="pref-avoid" placeholder="예: 화요일 오전, 목요일 오후는 알바라 어려워요" aria-label="피하고 싶은 시간">${a}</textarea>
          <p class="meta" style="margin-top:6px">에이전트가 다듬어서 조율 근거로 써요.</p></div>`;
    }
    // 온보딩 일정 연결: 에브리타임 링크(수업) · 구글 캘린더(개인 약속) · 직접 입력(알바·반복)
    function etRow() {
      const e = S.et, n = DATA.week.filter(b => b.src === 'et').length;
      const msg = e.st === 'reading' ? '<p class="et-msg meta">시간표를 읽는 중이에요…</p>'
        : e.st === 'ok' ? `<p class="et-msg">수업 ${n}개를 가져왔어요</p>`
        : e.st === 'fail' ? '<p class="et-msg bad">이 링크는 못 읽었어요. 시간표 공개 설정을 확인하거나 아래 직접 입력으로 넣어 주세요.</p>' : '';
      return `<div class="link-row" style="grid-template-columns:34px 1fr"><span class="ic">${ic('link', '')}</span><div>
          <p class="strong" style="font-size:14px">에브리타임 시간표${e.st === 'ok' ? ' <span class="badge ok">가져옴</span>' : ''}</p><p class="meta">수업 · 시간표 공유 링크를 붙여 넣어요</p>
          <div class="et-in"><input class="field num" value="${e.url}" data-action="et-url" placeholder="everytime.kr/@아이디" aria-label="에브리타임 공유 링크"><button class="btn small" data-action="et-load">불러오기</button></div>${msg}</div></div>`;
    }
    const obReset = () => { S.ob = 0; S.et = { url: '', st: 'idle' }; S.gcal = false; S.blk = null; S.obWeek = DATA.week.length; };
    // 온보딩 세 단계(S.ob): 0 조건 네 가지 → 1 일정 연결 → 2 준비 완료
    function ob() {
      if (S.ob === 0) return `<p class="q">회의 잡을 때 쓸 조건 네 가지</p><p class="q-hint meta">고르지 않은 건 지금 값 그대로 둬요. 시작한 뒤에도 언제든 고칠 수 있어요.</p>
        <section class="sec">${prefForm()}</section>
        <div class="cta"><button class="btn primary" data-action="ob-next">다음</button></div>`;
      if (S.ob === 1) {
        const any = S.et.st === 'ok' || S.gcal || DATA.week.length !== S.obWeek; // 직접 입력으로 하나라도 넣었으면
        return `<p class="q">내 일정 연결하기</p><p class="q-hint meta">수업과 개인 일정 시간은 에이전트가 빼고 조율해요.</p>
        <section class="sec">${etRow()}
          <div class="link-row"><span class="ic">${ic('cal', '')}</span><div><p class="strong" style="font-size:14px">구글 캘린더</p><p class="meta">개인 약속 · 읽기 권한만 받아요</p></div>
            ${S.gcal ? '<span class="badge ok">켜짐</span>' : '<button class="pill" data-action="gcal">연결</button>'}</div>
          <div class="link-row"><span class="ic">${ic('repeat', '')}</span><div><p class="strong" style="font-size:14px">직접 입력</p><p class="meta">알바 · 반복 같은 개인 일정</p></div>
            <button class="pill" data-action="blk-new">넣기</button></div>
          ${S.blk === null ? '' : blkForm()}
          <div class="lock">${ic('lock')}<span>팀원에게는 <b>바쁨 / 비어 있음</b>만 보여요. 약속 이름은 아무도 못 봐요.</span></div></section>
        <div class="cta"><button class="btn" data-action="ob-prev">이전</button><button class="btn ${any ? 'primary' : ''}" data-action="ob-next">${any ? '다음' : '나중에 하기'}</button></div>`;
      }
      return `<p class="q">내 에이전트가 준비됐어요</p><p class="q-hint meta">고른 조건으로 이렇게 말해요. 시작한 뒤에도 언제든 고칠 수 있어요.</p>
        <div class="quote" style="margin-top:12px"><p class="meta">내 에이전트가 이렇게 말해 줘요</p><p>${myQuote()}</p></div>
        <div class="cta"><button class="btn" data-action="ob-prev">이전</button><button class="btn primary" data-action="ob-done">시작하기</button></div>`;
    }

    /* ── 홈: 요약 + 다음 회의 + (팀장) 새 회의 잡기 + 내 할 일(날짜별 · 종류별) ── */
    // Component: DateBox (홈 다음 회의 · 일정 회의 목록 공통 날짜 칸). cls: conf 확정 · wait 확정 대기 · past 지난 회의
    const dateBox = (mo, d, wd, cls = '') => `<span class="dateblock ${cls}"><span>${mo}월</span><b class="num">${d}</b><span>${wd}</span></span>`;
    function meetingCard() {
      const m = meet(), conf = S.meeting === 'confirmed';
      if (S.coord) return `<section class="sec meetcard"><div class="row-between"><h2>다음 회의</h2><span class="badge">조율 중</span></div>
        <p class="strong" style="margin-top:4px">${m.title}</p><p class="meta num">조율 중 · ${m.range} 사이</p>
        <div class="row-between meet-foot"><span class="meta">에이전트끼리 시간을 맞추는 중</span>
          <button class="btn small" data-action="go" data-to="negotiate">조율 과정 보기</button></div></section>`;
      if (S.meeting === 'none') return `<section class="sec meetcard"><h2>다음 회의</h2>
        <p class="strong" style="margin-top:4px">아직 잡힌 회의가 없어요</p>
        <p class="meta">${S.fresh ? '첫 회의에서 주제와 역할을 정하면 좋아요. 회의 횟수 제한은 없어요.' : '마감 전에 필요할 때 언제든 잡아요. 회의 횟수 제한은 없어요.'}</p>
        ${isLeader() ? '' : `<p class="meta" style="margin-top:4px">팀장 ${nameOf(DATA.leader)}가 회의를 잡으면 알려 드려요.</p>`}</section>`;
      const mine = S.resp[S.me];
      return `<section class="sec hero meetcard"><div class="row-between"><h2>다음 회의</h2><span class="badge ${conf ? 'ok' : 'warn'}">${conf ? '확정' : '확정 대기'}</span></div>
        <div class="meet" style="margin-top:6px">${dateBox(11, m.day, m.wd)}
          <div style="flex:1;min-width:0"><p class="strong">${m.title}</p><p class="meta">${m.time} · ${m.mode} · ${m.length}</p>
            <p class="tick"><span class="tick-l">시작까지</span><span class="num" id="tick">${countdown()}</span></p></div></div>
        <div class="row-between meet-foot"><span class="meta">${S.pick != null ? '판단 에이전트가 조정했어요' : conf ? '모두 수락했어요' : `수락 ${accepted()}/${voters().length} · 내 응답 ${mine}`}</span>
          <button class="btn small ${!conf && mine === '대기' ? 'primary' : ''}" data-action="go" data-to="negotiate">조율 과정 확인</button></div></section>`;
    }
    // 새 회의 잡기는 다음 회의와 따로(팀장만). 회의가 없으면 강조
    const newMeetBtn = () => isLeader() ? `<button class="newmeet" data-action="go" data-to="newmeet"><span class="plus">+</span>
        <span><b>${S.fresh ? '첫 회의 잡기' : '새 회의 잡기'}</b><span class="meta">기간과 길이만 정하면 에이전트 ${DATA.members.length}명이 시간을 조율해요</span></span></button>` : '';
    // Component: MiniTodo (홈의 내 할 일 한 줄)
    const miniRow = (t, right) => `<button class="mini" data-action="check" data-id="${t.id}" data-done="${t.status === 'done'}">
        <span class="check"></span><span class="t">${t.title}${riskOf(t) && t.status !== 'done' ? ` <span class="badge ${RISK_SEV[riskOf(t)]}">${riskOf(t)}</span>` : ''}${t.autoDone ? ' <span class="badge ok">회의에서 완료</span>' : ''}</span><span class="tag num">${right}</span></button>`;
    function myTasks() {
      const mine = tasksAll().filter(t => t.owner === S.me).sort((a, b) => dueN(a) - dueN(b));
      const open = mine.filter(t => t.status !== 'done'), done = mine.filter(t => t.status === 'done');
      const T = P.todayN, B = [['기한 지남', t => dueN(t) < T, 'var(--danger)'], ['오늘', t => dueN(t) === T, 'var(--point)'], ['내일', t => dueN(t) === T + 1, 'var(--point)'],
        ['그 이후', t => dueN(t) > T + 1, 'var(--text)']];
      const body = B.map(([label, f, col]) => [label, col, open.filter(f)]).filter(g => g[2].length).map(([label, col, list]) =>
        `<span class="cat" style="--mc:${col}">${label} <span class="n num">${list.length}</span></span>${list.map(t => miniRow(t, t.due)).join('')}`).join('');
      const doneHTML = done.length ? `<span class="cat">완료 <span class="n num">${done.length}</span></span>${done.map(t => miniRow(t, t.due)).join('')}` : '';
      const empty = !tasksAll().length ? `<p class="strong" style="margin-top:8px">아직 할 일이 없어요</p><p class="meta">회의를 기록하면 에이전트가 할 일을 뽑아 제안해요. 회의 상세에서 확정하면 여기에 들어와요.</p><button class="link sm" data-action="go" data-to="schedule">일정으로 가기</button>`
        : '<p class="meta" style="margin-top:8px">남은 할 일이 없어요.</p>';
      return `<section class="sec"><h2 style="margin:0">내 할 일</h2>
        ${body || empty}${doneHTML}
        ${mine.length ? '<button class="link sm" data-action="go" data-to="tasks" style="margin-top:4px">팀 할 일 보기</button>' : ''}</section>`;
    }
    // 방 막 만든 직후: 초대 현황
    function inviteCard() {
      const n = S.fresh ? 1 : DATA.members.length;
      return `<section class="sec"><div class="row-between"><h2 style="margin:0">팀원 초대</h2><span class="meta num">${n}/${DATA.members.length} 들어옴</span></div>
        <div class="row-between" style="margin-top:8px"><span class="code num" style="font-size:22px">${P.code}</span><button class="pill go" data-action="toast" data-msg="초대 링크를 복사했어요">링크 복사</button></div>
        <div class="members-in">${DATA.members.map((m, k) => k < n ? av(m.id) : `<span class="av" data-in="false">?</span>`).join('')}</div>
        <p class="meta" style="margin-top:6px">들어온 팀원은 질문 네 개에 답하면 에이전트가 준비돼요.</p></section>`;
    }
    // 홈 맨 위: 왼쪽 마감 디데이 | 오른쪽 오늘 + 기간 막대(오늘 위치) + 시작·마감일
    function periodCard() {
      const T = P.totalDays, passed = S.fresh ? 0 : T - P.daysLeft, now = Math.round(passed / T * 100);
      return `<section class="sec hero home-hero"><div class="hh">
          <div><span class="w-label">마감까지</span><b class="hero-n num">D-${T - passed}</b></div>
          <div style="min-width:0"><span class="meta num" style="color:var(--point-ink);font-weight:700">오늘 ${S.fresh ? P.start : P.today}</span>
            <div class="period" role="img" aria-label="전체 ${T}일 중 ${passed}일 지남"><i style="width:${now}%"></i><b style="left:${now}%"></b></div>
            <div class="row-between"><span class="meta num">${P.start} 시작</span><span class="meta num">${P.deadline} 마감</span></div></div></div></section>`;
    }
    function home() {
      return `${periodCard()}
        ${S.fresh ? inviteCard() : ''}
        ${meetingCard()}
        ${newMeetBtn()}
        ${myTasks()}`;
    }

    /* ── 알림 (홈 오른쪽 위 종) ── */
    // 받침 있으면 a, 없으면 b(서연이 / 지수가, '화면 시안 3종'을 / '…정리'가)
    const jo = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? a : b; };
    const daysOver = t => { const [m, d] = t.due.split('/').map(Number), T = P.todayN;
      return Math.round((new Date(2026, Math.floor(T / 100) - 1, T % 100) - new Date(2026, m - 1, d)) / 864e5); };
    // 알림 문장은 할 일 데이터(이름·담당자·기한·막힌 이유 note)에서 만든다
    function riskText(r, t) {
      const who = nameOf(t.owner) + jo(nameOf(t.owner), '이', '가'), what = `'${t.title}'`;
      if (r.type === '늦음') return `${what} 기한 ${t.due}이 ${daysOver(t)}일 지났어요`;
      if (r.type === '막힘') return `${who} ${what}${jo(t.title, '이', '가')} 막혔다고 표시했어요.${t.note ? ` "${t.note}"` : ''}`;
      return `${who} ${what}${jo(t.title, '을', '를')} 끝냈어요`;
    }
    function riskCard(r) {
      const t = r.t;
      return `<article class="risk" data-type="${r.type}"><div class="row-between"><span class="badge ${RISK_SEV[r.type]}">${r.type}</span>
          <button class="link sm" data-action="go" data-to="tasks">할 일 보기</button></div>
        <p class="risk-reason">${riskText(r, t)}</p></article>`;
    }
    function alerts() {
      const items = risks().map(riskCard);
      if (S.clock && S.meeting === 'confirmed') items.splice(1, 0, `<article class="risk"><span class="badge ok">회의 30분 전</span>
        <p class="risk-reason">중간 점검 전 회의가 16:00에 비대면으로 시작해요.</p>
        <p class="meta">이번에 다룰 것: 지난 회의 보류 항목 '발표 순서', 다음 점검까지 남은 할 일 ${left()}개</p></article>`);
      if (S.meeting === 'proposed') items.push(`<article class="risk"><span class="badge warn">확정 대기</span>
        <p class="risk-reason">조율 결과가 나왔어요. 수요일 16:00–18:00, 비대면.</p><div class="row-between"><span class="meta">현우를 먼저 챙긴 결과예요</span>
        <button class="link sm" data-action="go" data-to="proposal">조율 결과 보기</button></div></article>`);
      return `<section class="sec"><h2>먼저 챙길 것</h2>${items.join('') || '<p class="strong">늦거나 막힌 일이 없어요</p><p class="meta">팀이 잘 가고 있어요. 챙길 일이 생기면 여기에 알려 드려요.</p>'}</section>
        <section class="sec"><h2>에이전트 기록</h2>${(S.fresh ? [{ at: '10/13 14:02', what: '방을 만들었어요', why: '팀원이 들어와 조건을 알려 주면 회의 시간을 조율할 수 있어요.' }] : DATA.agentLog).map(l => `<div class="list-row"><div><p class="strong">${l.what}</p><p class="meta">${l.why}</p></div><span class="meta num">${l.at}</span></div>`).join('')}</section>
        <section class="sec"><h2>양보 기록</h2>${S.fresh ? '<p class="meta">아직 잡은 회의가 없어요. 회의가 잡히면 누가 맞춰 줬는지 여기에 남겨요.</p>'
          : DATA.history.map(h => `<div class="list-row"><div><p class="strong">${h.date}</p><p>${nameOf(h.who)}가 맞춰 줬어요</p><p class="meta">${h.why}</p></div></div>`).join('')}</section>`;
    }

    /* ── 회의 잡기 (팀장만) ── */
    function newmeet() {
      if (!isLeader()) return `<section class="sec"><h2>회의 잡기는 팀장만 할 수 있어요</h2><p class="meta">팀장 ${nameOf(DATA.leader)}가 회의를 잡으면 조율 과정을 같이 볼 수 있어요. 왼쪽 시연 장치에서 사용자를 지수로 바꿔 보세요.</p></section>`;
      const n = S.nm, h = n.len / 60;
      return `<section class="sec">
          <label class="field-l">주제<input class="field" value="${n.title}" data-action="nm" data-k="title"></label>
          <span class="field-l">언제부터 언제 사이에</span>
          <div class="range"><input class="field num" type="date" value="${n.from}" data-action="nm" data-k="from" aria-label="시작일"><span>–</span>
            <input class="field num" type="date" value="${n.to}" data-action="nm" data-k="to" aria-label="종료일"></div>
          <span class="field-l">회의 길이 (30분 단위)</span>
          <div class="stepper"><button data-action="nm-len" data-v="-30" aria-label="30분 줄이기">−</button><b class="num">${Number.isInteger(h) ? h + '시간' : Math.floor(h) ? Math.floor(h) + '시간 30분' : '30분'}</b><button data-action="nm-len" data-v="30" aria-label="30분 늘리기">+</button></div>
          <span class="field-l">방식</span>
          <div class="seg">${['대면', '비대면', '상관없음'].map(v => `<button data-action="nm-mode" data-v="${v}" aria-pressed="${n.mode === v}">${v}</button>`).join('')}</div></section>
        <section class="sec"><p class="meta">팀원 ${DATA.members.length}명의 에이전트가 각자의 시간표와 조건으로 조율해요. 최대 3라운드, 30초쯤 걸려요. 회의 횟수 제한은 없어요.</p></section>
        <div class="cta"><button class="btn primary" data-action="nm-start">조율 시작</button></div>`;
    }

    /* ── 조율 과정: 라운드별 판단 에이전트 제안 → 팀원 에이전트 응답. 결과 확인 버튼은 아래에 늘 고정 ── */
    function msg(t, isNew) {
      const cls = isNew ? ' enter' : '';
      // 판단 에이전트: 상자 하나(양보 점수 변화 → 제안 시간) → 이유 문장
      if (t.kind === 'judge') {
        const ys = t.yields ? `<p class="meta">양보 점수</p>${t.yields.map(([id, from, to]) => `<div class="yrow"><span>${nameOf(id)}</span>${steps(to)}<span>${from === to ? YIELD[to] : `${YIELD[from]} → <b>${YIELD[to]}</b>`}</span></div>`).join('')}` : '';
        const ps = t.picks ? t.picks.map(([l, v]) => `<div class="pick"><span>${l}</span><b class="num">${v}</b></div>`).join('') : '';
        return `<div class="judge${cls}"><div class="judge-h">⚖ 판단 에이전트 (중립)</div>
        ${ys || ps ? `<div class="box">${ys}${ys && ps ? '<div class="divider" style="margin:6px 0"></div>' : ''}${ps}</div>` : ''}
        <p class="say">${t.text}</p></div>`;
      }
      // 팀원 에이전트: 이름 옆 뱃지 하나에 응답과 불편 정도(내 것만 숫자)
      const me = t.who === S.me, ok = t.res === '수락';
      // res가 없으면 어필이다. 아직 판정이 없으니 수락·거절 뱃지를 달 수 없고,
      // 불편 점수도 아직 말할 자리가 아니다(제안된 시간이 없으므로).
      const badge = !t.res ? '<span class="badge">원하는 시간</span>'
        : `<span class="badge ${ok ? 'ok' : 'danger'}">${ok ? '수락' : '거절'} · ${me ? `내 불편 <span class="num">${t.score}/5</span>` : LEVEL(t.score)}</span>`;
      return `<div class="msg${cls}" data-kind="${me ? 'me' : 'member'}">${av(t.who)}<div class="body">
        <div class="who"><span class="name">${me ? '내 에이전트' : nameOf(t.who) + '의 에이전트'}</span>${badge}</div>
        <p class="text">${t.text}</p></div></div>`;
    }
    const talkHTML = n => DATA.talk.slice(0, n).map((t, i) => t.round
      ? `<div class="round-div">${t.round}라운드</div>` : msg(t, i === n - 1 && S.talk === 'play')).join('');
    const talkDone = () => S.shown >= DATA.talk.length;
    const roundNow = () => S.talk === 'fail' ? 3 : S.talk === 'none' ? 1 : Math.max(1, DATA.talk.slice(0, S.shown).filter(t => t.round).length);
    function negHead() {
      const m = DATA.meeting, r = roundNow(), done = S.talk === 'play' && talkDone();
      return `<p class="topic">${m.title} ${S.pick != null ? '— 조정해서 정했어요' : done ? '시간을 정했어요' : '시간 정하는 중'}</p>
        <div class="chips-s"><span>${m.length}</span><span class="num">${m.range}</span><span>대면 · 비대면 상관없음</span></div>
        <div class="rounds">${[1, 2, 3].map(k => `<i class="${k <= r ? 'on' : ''}"></i>`).join('')}<span class="num">${r} / 최대 3 라운드</span></div>`;
    }
    function negDock() {
      const m = DATA.meeting;
      let sum;
      // 11/5: 조정된 안은 수락·거절 없이 바로 확정된다. 막아 세울 단계가 없다.
      if (S.pick != null) sum = `<div class="row-between"><span><span class="badge warn">조정 · 확정</span> <span class="meta">${S.talk === 'fail' ? '3라운드' : '1명 불참안'}</span></span><span class="yield-val">${nameOf(cands()[S.pick].gets)} ${steps(2)}${YIELD[2]}</span></div>
        <b class="when num">${cands()[S.pick].label}</b><p class="meta">이미 확정된 회의예요. 피드백 한 줄만 받아요</p>`;
      else if (!talkDone()) sum = `<span class="badge">조율 중</span> <span class="meta num">${roundNow()}라운드 진행 중 · 최대 3</span>`;
      else sum = `<div class="row-between"><span><span class="badge ok">합의</span> <span class="meta">2라운드에서 합의</span></span><span class="yield-val">${nameOf(m.gets)} ${steps(1)}${YIELD[1]}</span></div>
        <b class="when num">${m.short} ${m.mode}</b>
        <p class="meta">왜: ${nameOf(m.cared.id)}의 앞선 양보를 먼저 챙기고, 이번엔 ${nameOf(m.gets)}가 맞춰 줬어요</p>`;
      return `<div class="dock-sum">${sum}</div><button class="btn primary" data-action="to-result">조율 결과 확인하기</button>`;
    }
    function negotiate() {
      const head = `<div class="neg-head" id="neg-head">${negHead()}</div>`, dock = `<div class="cta col" id="neg-dock">${negDock()}</div>`;
      // 11/5: 판단 에이전트가 정한 안 하나를 보여 주고 피드백 칸을 연다. 고르는
      // 버튼도, 기간을 넓히는 버튼도 없다. 팀원도 팀장과 같은 화면을 본다.
      const none = S.talk === 'none';
      const settled = S.pick != null ? cands()[S.pick] : null;
      const pickSec = settled ? `<section class="sec"><h2>조정된 안</h2>
          <div class="list-row"><div><p class="strong">${settled.label}</p><p class="meta">${settled.why}</p></div>
          <span class="badge warn">확정</span></div>
          <p class="meta" style="margin-top:8px">수락·거절 버튼이 없어요. 이미 확정된 회의예요 — 대신 한 줄 남기면 다음 회의 선호에 반영돼요.</p></section>` : '';
      if (S.talk === 'fail') return head + `<div class="talk">${talkHTML(10)}<div class="round-div">2–3라운드</div>
          ${msg({ kind: 'judge', text: '두 번 더 조율했지만 모두 되는 시간을 찾지 못했어요. 불편 점수와 그동안의 양보를 따져서 목요일 13:00–15:00, 대면으로 정했어요. 이 시간으로 확정할게요.' })}</div>` + pickSec + dock;
      if (none) return head + `<div class="talk"><div class="round-div">1라운드</div>
          ${msg({ kind: 'judge', text: '이번 주에는 네 명 모두 되는 2시간이 없어요. 기간을 넓히지 않고, 불편 점수와 그동안의 양보를 따져서 현우가 빠지는 안으로 정했어요. 현우에게는 회의록 요약을 따로 보내요.' })}</div>` + pickSec + dock;
      return head + `<div class="talk" id="talk">${talkHTML(S.shown)}</div>`
        + (talkDone() ? `<div style="text-align:center"><button class="link sm" data-action="replay-view">처음부터 다시 보기</button></div>` : '') + dock;
    }
    function play() {
      clearInterval(timer);
      if (S.talk !== 'play' || talkDone()) return;
      timer = setInterval(() => {
        S.shown++;
        $('#talk').innerHTML = talkHTML(S.shown);
        $('#neg-head').innerHTML = negHead();
        $('#neg-dock').innerHTML = negDock();
        $('#view').scrollTop = $('#view').scrollHeight;
        if (talkDone()) { clearInterval(timer); S.coord = false; render(true); $('#view').scrollTop = $('#view').scrollHeight; }
      }, 1600);
    }

    /* ── 조율 결과 확인: 시간 → 내 부담(나만) → 다른 사람 부담(말로만) → 판단 근거 → 사람별 응답 ── */
    function proposal() {
      const m = meet(), conf = S.meeting === 'confirmed', picked = S.talk !== 'play';
      const my = m.burden.find(b => b.id === S.me);
      const others = m.burden.filter(b => b.id !== S.me).map(b => `<div class="other">${av(b.id)}<span class="strong">${nameOf(b.id)}</span>
        <span class="badge ${LEVEL_CLS(b.score)}">${LEVEL(b.score)}</span><span class="meta">${b.reason}</span></div>`).join('');
      const gets = member(m.gets), isMe = m.gets === S.me, gs = m.burden.find(b => b.id === m.gets).score, pt = YIELD_PT(gs);
      const from = gets.base ?? gets.yield, to = Math.min(from + 1, 2); // base: 확정 전 단계(autoConfirm이 남김)
      const resp = voters().map(x => { const r = S.resp[x.id];
        return `<div>${av(x.id)}<span>${x.name}${x.id === S.me ? ' (나)' : ''}</span><span class="badge ${r === '수락' ? 'ok' : r === '거절' ? 'danger' : ''}">${r === '수락' ? '✓ 수락' : r === '거절' ? '✕ 거절' : '대기'}</span></div>`; }).join('');
      const mine = S.resp[S.me];
      const waiting = voters().filter(x => S.resp[x.id] !== '수락').map(x => x.name).join(', ');
      const cta = conf ? ''
        : mine === '대기' ? `<button class="btn" data-action="reject">거절</button><button class="btn primary" data-action="accept">수락</button>`
        : mine === '거절' ? `<button class="btn primary" data-action="replay">다음 라운드로 다시 조율</button>`
        : `<button class="btn" disabled>${waiting}의 응답을 기다리는 중</button>`;
      return `<section class="sec res-top"><div class="row-between"><span><span class="badge ${picked ? 'warn' : 'ok'}">${picked ? '조정' : '합의'}</span> <span class="meta">${S.talk === 'none' ? '불참안' : picked ? '3라운드' : '2라운드'}</span></span>
            <span class="badge ${conf ? 'ok' : 'warn'}">${conf ? '확정' : '확정 대기'}</span></div>
          <span class="big num">${m.short}</span><p class="meta">${m.mode} · ${m.length} · ${m.title}</p>
          ${m.out ? `<p class="meta">${nameOf(m.out)} 빠짐 · 회의록 요약을 따로 보내요</p>` : ''}</section>
        <section class="sec mine-b"><div class="row-between"><div><span class="w-label">내 부담</span><p class="strong">내 불편 <span class="num">${my.score}/5</span> · ${my.reason}</p></div><span class="meta">나만 보여요</span></div></section>
        <section class="sec"><h2>다른 사람 부담</h2>${others}</section>
        <div class="judge judge-card"><div class="judge-h">⚖ 판단 에이전트 (중립)</div><p class="say">${m.judge}</p>
          <div class="box"><p class="meta">이번에 양보 점수 받는 사람</p>
            <div class="yrow" style="grid-template-columns:auto auto 1fr"><b>${isMe ? '나' : gets.name}${isMe ? ` <span class="num">+${pt}</span>` : ''}</b>${steps(to)}<span>${from === to ? `<b>${YIELD[to]}</b> · 가장 높은 단계라 그대로` : `${YIELD[from]} → <b>${YIELD[to]}</b>`}</span></div>
            <p class="meta" style="margin-top:4px">${isMe ? `내 불편 <span class="num">${gs}/5</span>만큼 맞춰 줘서 <span class="num">+${pt}</span>이에요. 조금 불편하면 +1, 많이 불편하면 +2를 받아요.`
              : `${gets.name}는 ${gs >= 4 ? '많이' : '조금'} 불편한 시간을 맞춰 줬어요. 불편한 만큼 양보 점수를 더 받아요.`}</p></div></div>
        <section class="sec"><div class="row-between"><h2 style="margin:0">사람별 응답</h2><span class="strong num">${voters().length}명 중 ${accepted()}명 수락</span></div><div class="resp4">${resp}</div></section>
        ${fbCard()}
        ${cta ? `<div class="cta">${cta}</div>` : ''}`;
    }
    // 회의 일정 피드백: 수락·거절할 때 남긴 한 줄. 선호가 바뀌면 무엇이 바뀌었는지 보여 주고 되돌릴 수 있다
    function fbCard() {
      const f = S.fb; if (!f || S.resp[S.me] === '대기') return '';
      const say = f.text.replace(/[<>]/g, '');
      return `<section class="sec"><span class="w-label">이 시간에 남긴 한 줄</span><p class="strong">“${say}”</p>
        ${!f.change ? '<p class="meta">남겨 줘서 고마워요. 시간 선호와는 상관없는 말이라 바꾼 건 없어요.</p>'
          : `<div class="row-between"><span class="meta">${f.undone ? '되돌렸어요. 선호는 그대로예요.' : f.change}</span>${f.undone ? '' : '<button class="link sm" data-action="fb-undo">되돌리기</button>'}</div>`}</section>`;
    }
    // 남긴 말에서 다음 조율에 쓸 선호 한 가지를 고른다(시연용 간단 해석). 상관없는 말이면 아무것도 바꾸지 않는다
    function fbChange(s) {
      const d = s.match(/([월화수목금토일])요일/);
      if (d) return `다음부터 ${d[1]}요일은 덜 잡을게요`;
      if (/이르|일찍|아침|오전/.test(s)) return '다음부터 오전 이른 시간은 덜 잡을게요';
      if (/늦|밤/.test(s)) return '다음부터 밤 늦은 시간은 덜 잡을게요';
      if (/수업|빠듯|이동|바로 뒤/.test(s)) return '다음부터 수업 바로 뒤는 30분 띄워서 잡을게요';
      return null;
    }
    function feedback(v) {
      S.fb = typeof v === 'string' && v.trim() ? { text: v.trim(), change: fbChange(v), undone: false } : null;
    }

    /* ── 일정 = 회의 관리: 마감·오늘 위치 → 지금 회의 기록하기 → 조율 중 → 잡힌 회의 → 지난 회의 ── */
    const dateBlk = (m, cls = '') => { const [mo, d] = m.date.split('/'); return dateBox(mo, d, m.dateL.slice(-1), cls); };
    function schedule() {
      const m = meet(), conf = S.meeting === 'confirmed';
      const today = DATA.meetings.find(x => x.id === 'm3'), past = meetings();
      const recNow = `<button class="rec-now" data-action="rec-now"><span class="rec-ic">${ic('mic', '')}</span><span><b>지금 회의 받아적기</b>
          <span>${!S.recorded ? `오늘 ${S.adhoc ? '지금' : today.time} '${today.topic}' 회의를 받아적어요` : '잡힌 회의가 없어도 주제 한 줄만 쓰고 바로 받아적어요'}</span></span></button>`;
      const coordLabel = '조율 중'; // 조정은 S.coord가 false라 이 칸에 안 온다
      const coord = S.coord ? `<div class="sec-h"><h2>조율 중인 회의</h2></div>
        <section class="sec"><button class="mrow" data-action="go" data-to="negotiate"><span class="dateblock coord"><b>–</b></span>
          <span class="body"><span class="strong">${m.title}</span><span class="meta num">조율 중 · ${m.range} 사이 · ${m.length}</span></span>
          <span class="badge ${S.talk === 'play' ? '' : 'warn'}">${coordLabel}</span></button></section>` : '';
      const booked = [];
      if (!S.recorded) booked.push(`<div class="mrow">${dateBlk(today)}<span class="body"><span class="strong">${today.topic}</span>
          <span class="meta num">오늘 ${S.adhoc ? '지금' : today.time} · ${today.mode}</span></span>
          <button class="btn small primary" data-action="go-mtg" data-id="${today.id}">기록 시작</button></div>`);
      if (!S.coord && S.meeting !== 'none') booked.push(`<button class="mrow" data-action="go" data-to="proposal">
          ${dateBox(11, m.day, m.wd, conf ? 'conf' : 'wait')}
          <span class="body"><span class="strong">${m.title}</span><span class="meta num">${m.time} · ${m.mode} · ${m.length}</span>
            <span class="meta num">${S.pick != null ? '판단 에이전트가 조정했어요' : conf ? '모두 수락했어요' : `수락 ${accepted()}/${voters().length} · 내 응답 ${S.resp[S.me]}`}</span></span>
          <span class="badge ${conf ? 'ok' : 'warn'}">${conf ? (S.pick != null ? '확정 · 조정' : '확정') : '확정 대기'}</span></button>`);
      const pastRow = x => `<button class="mrow" data-action="go-mtg" data-id="${x.id}">${dateBlk(x, 'past')}
          <span class="body"><span class="strong">${x.topic}</span><span class="meta">${x.length} · 회의록 열기</span></span>
          ${pendingCount(x) ? `<span class="badge ai num">제안 ${pendingCount(x)}개</span>` : ''}</button>`;
      return `${recNow}${coord}
        <div class="sec-h"><h2>잡힌 회의</h2></div>
        <section class="sec">${booked.join('') || `<p class="meta">잡힌 회의가 없어요.${isLeader() ? ' 새 회의를 잡으면 에이전트끼리 시간을 조율해요.' : ` 팀장 ${nameOf(DATA.leader)}가 회의를 잡으면 알려 드려요.`}</p>`}</section>
        <div class="sec-h"><h2>지난 회의</h2><span class="meta num">${past.length}개</span></div>
        <section class="sec">${past.map(pastRow).join('') || '<p class="meta">아직 지난 회의가 없어요. 회의를 기록하면 요약과 할 일 제안이 여기에 쌓여요.</p>'}</section>`;
    }

    /* ── 회의 상세(일정 탭에서 회의를 누름): 기록 전이면 기록 → 기록 뒤엔 요약·원문 → 끝난 일(자동 완료) → AI 제안(여기서만 보임) ── */
    function recCard() {
      if (S.rec === 'live') return `<section class="sec"><div class="row-between"><span class="rec-dot">받아적는 중</span><span class="meta">참석 ${DATA.members.length}명</span></div>
          <p class="rec-clock num" id="rec-clock">00:00</p>
          <p class="meta">음성은 저장하지 않고 글자만 남겨요.</p>
          <div class="live" id="live">${liveLines()}</div>
          <p class="meta" style="margin-top:10px">말한 사람은 목소리로 나눠 두고, 끝나면 누군지 한 번만 확인해요.</p>
          <button class="btn primary block" data-action="rec" data-to="voice">정지</button></section>`;
      if (S.rec === 'voice') return voiceCard();
      if (S.rec === 'paste') return `<section class="sec"><h2>회의록 직접 쓰기</h2><p class="meta">메모나 다른 곳에 적은 회의록을 붙여 넣으세요.</p>
          <textarea class="field" aria-label="회의록" style="min-height:min(52vh, 420px)">${DATA.meetings[0].lines.map(([w, t]) => `${nameOf(w)}: ${t}`).join('\n')}</textarea>
          <div class="btn-row"><button class="btn" data-action="rec" data-to="idle">취소</button><button class="btn primary" data-action="rec" data-to="work">정리하기</button></div></section>`;
      // AI가 멈춰도 에러 화면 대신 한 줄 안내 + 다시 하기(원문은 이미 저장)
      if (S.rec === 'fail') return `<section class="sec"><span class="badge warn">정리 못 함</span><p class="strong" style="margin-top:6px">정리를 잠시 못 했어요. 잠시 후 다시 해 주세요</p>
          <p class="meta">받아적은 원문은 저장했어요. 다시 하면 그 원문으로 정리해요.</p>
          <div class="btn-row"><button class="btn primary" data-action="rec" data-to="work">다시 하기</button></div></section>`;
      if (S.rec === 'work') return `<section class="sec"><p class="strong">회의록을 정리하고 할 일을 뽑는 중이에요</p>${bar(60)}<p class="meta">원문은 먼저 저장했어요. 지난 할 일 중 끝났다고 한 것도 같이 찾아요.</p></section>`;
      return `<section class="sec"><p class="strong">회의 기록</p><p class="meta">할 일 제안은 회의가 끝난 뒤 여기서 확정해야 할 일 탭에 들어가요</p>
          <button class="btn primary block big" data-action="rec" data-to="live">${ic('mic', '')}받아적기 시작</button>
          <p class="meta" style="margin-top:6px;text-align:center">음성은 저장하지 않고 글자만 남겨요</p>
          <div style="text-align:center"><button class="link sm" data-action="rec" data-to="paste">직접 쓰기</button></div></section>`;
    }
    // 받아적힌 글: 받아적는 동안은 누군지 모르니 목소리 A·B…로만 적는다
    const voices = () => [...new Set(DATA.meetings[0].lines.map(l => l[0]))];
    const voiceOf = w => `목소리 ${'ABCDEF'[voices().indexOf(w)]}`;
    const liveLines = () => S.live.length ? `<ol class="lines">${S.live.map(([w, t]) => `<li class="line"><b>${voiceOf(w).slice(-1)}</b><span>${t}</span></li>`).join('')}</ol>`
      : '<p class="wait">말을 시작하면 여기에 글자로 쌓여요</p>';
    // Component: VoiceCheckCard — 녹음이 끝나면 목소리마다 누군지 한 번만 고른다(AI가 먼저 짐작해 둠)
    const voiceCard = () => `<section class="sec"><div class="row-between"><h2 style="margin:0">말한 사람 확인</h2><span class="badge ai">AI가 나눔</span></div>
          <p class="meta">목소리 ${voices().length}개로 나눴어요. 누군지 한 번만 고르면 회의록 전체에 반영돼요.</p>
          ${voices().map(w => `<div class="list-row"><div style="min-width:0"><p class="strong">${voiceOf(w)}</p><p class="meta">'${DATA.meetings[0].lines.find(l => l[0] === w)[1]}'</p></div>
            <select class="field" aria-label="${voiceOf(w)}는 누구" style="flex:none">${DATA.members.map(x => `<option${x.id === w ? ' selected' : ''}>${x.name}</option>`).join('')}</select></div>`).join('')}
          <button class="btn primary block" data-action="rec" data-to="work" style="margin-top:12px">맞아요, 정리하기</button></section>`;
    // Component: SuggestionCard — 두 줄: ① AI 제안 + 제목 ② 담당자·기한 | 삭제·확정
    function sugCard(m, s, i) {
      const t = DATA.tasks.find(x => x.id === s.task);
      if (!t || s.state === 'deleted') return '';
      const ref = `data-m="${m.id}" data-i="${i}"`;
      if (s.kind === 'del') {
        if (s.state === 'kept') return `<article class="sug done"><div class="sug-h"><span class="badge">유지함</span><span class="strong">${t.title}</span></div>
          <p class="meta num">${nameOf(t.owner)} · ${t.due}까지</p></article>`;
        return `<article class="sug"><div class="sug-h"><span class="badge ai">AI 제안</span><span class="strong">${t.title}</span></div>
          <p class="meta">${nameOf(t.owner)} 담당 · ${s.why}</p>
          <div class="sug-act"><button class="btn small quiet" data-action="sug-keep" ${ref}>유지</button><button class="btn small danger" data-action="sug-del" ${ref}>삭제</button></div></article>`;
      }
      if (!isPending(s)) return `<article class="sug done"><div class="sug-h"><span class="badge ok">확정 · ${nameOf(t.by)}</span><span class="strong">${t.title}</span></div>
          <p class="meta num">${t.owner ? nameOf(t.owner) : '담당자 없음'} · ${t.due}까지</p></article>`;
      return `<article class="sug"><div class="sug-h"><span class="badge ai">AI 제안</span><input class="title" value="${t.title}" data-action="edit" data-id="${t.id}" data-k="title" aria-label="제목"></div>
        <div class="sug-row"><select class="field" data-action="edit" data-id="${t.id}" data-k="owner" aria-label="담당자">${ownerOpts(t.owner)}</select>
          ${dueInput(`data-action="edit" data-id="${t.id}" data-k="due"`, t.due)}
          <button class="btn small del" data-action="sug-drop" ${ref}>삭제</button><button class="btn small primary" data-action="sug-ok" ${ref}>확정</button></div></article>`;
    }
    const ownerOpts = sel => `<option value="">담당자 없음</option>${DATA.members.map(x => `<option value="${x.id}"${x.id === sel ? ' selected' : ''}>${x.name}</option>`).join('')}`;
    // 회의에서 끝났다고 한 일: 할 일 행과 같은 모양(체크됨 + 회의에서 완료 뱃지 + 되돌리기)
    function autoRow(m, s, i) {
      const t = DATA.tasks.find(x => x.id === s.task), undone = s.state === 'undone';
      if (!t) return ''; // 할 일 탭에서 삭제한 일
      return `<li class="todo" data-done="${!undone}">
        <div class="todo-head"><div class="todo-title"><button class="check" data-action="auto-toggle" data-m="${m.id}" data-i="${i}" aria-label="${t.title} 완료 표시"></button><span class="name">${t.title}</span></div>
          <div class="todo-badges"><span class="badge ${undone ? '' : 'ok'}">${undone ? '진행 중으로 되돌림' : '회의에서 완료'}</span></div></div>
        <div class="meta-row todo-meta"><span class="num">${nameOf(t.owner)} · ${t.due}까지</span></div></li>`;
    }
    // 직접 추가: 회의 상세면 그 회의 출처로 바로 확정(제안을 거치지 않음), 할 일 탭(m = null)이면 출처 "직접 추가"
    function addCard(m) {
      const key = m ? m.id : 'tasks';
      if (S.add !== key) return `<button class="btn dashed small add-btn" data-action="add-open" data-id="${key}">${m ? '+ 직접 추가' : '+ 할 일 추가'}</button>`;
      const d = S.addDraft;
      return `<article class="sug done"><div class="sug-h"><span class="badge">직접 추가</span><input class="title" value="${d.title}" data-action="add-f" data-k="title" placeholder="할 일 제목" aria-label="제목"></div>
        <div class="sug-row"><select class="field" data-action="add-f" data-k="owner" aria-label="담당자">${ownerOpts(d.owner)}</select>
          ${dueInput('data-action="add-f" data-k="due"', d.due)}
          <button class="btn small quiet" data-action="add-cancel">취소</button><button class="btn small primary" data-action="add-ok" data-id="${key}">추가</button></div></article>`;
    }
    function meetingDetail() {
      const m = DATA.meetings.find(x => x.id === S.mtg) || DATA.meetings[0];
      const who0 = `<span>참석 ${DATA.members.map(x => x.name).join(' · ')}</span>`;
      if (m.id === 'm3' && !S.recorded) return `<section class="sec"><p class="topic">${m.topic}</p>
          <div class="meta-row"><span>오늘 ${S.adhoc ? '지금' : m.time}</span><span>${m.mode}</span>${who0}</div></section>${recCard()}`;
      const sum = Object.entries(m.summary).filter(([, v]) => v.length).map(([k, v]) => `<div class="sum-g"><b>${k}</b>
        ${v.map(t => `<div class="sum">${t}</div>`).join('')}</div>`).join('');
      const pick = (f, card) => m.sugs.map((s, i) => (f(s) ? card(m, s, i) : '')).filter(Boolean);
      const autos = pick(s => s.kind === 'done', autoRow), main = pick(counted, sugCard), dels = pick(s => s.kind === 'del', sugCard);
      const total = m.sugs.filter(counted).length, pend = pendingCount(m);
      return `<section class="sec"><p class="topic">${m.topic}</p>
          <div class="meta-row"><span>${m.dateL}</span><span>${m.length}</span>${who0}</div>
          <button class="btn small block" data-action="raw">${S.raw ? '원문 접기' : `원문 전체 보기 (${m.lines.length}줄)`}</button>
          ${S.raw ? `<ol class="lines">${m.lines.map(([w, t]) => `<li class="line"><b>${nameOf(w)}</b><span>${t}</span></li>`).join('')}</ol>` : ''}</section>
        ${sum ? `<section class="sec">${sum}</section>` : ''}
        ${autos.length ? `<div class="sec-h"><h2>회의에서 끝난 일</h2><span class="meta">직접 체크 안 해도 돼요</span></div><ul class="todos auto-list">${autos.join('')}</ul>` : ''}
        <div class="sug-top"><div style="flex:1"><p class="strong">이 회의에서 나온 할 일 ${total}개</p>
            ${total ? `<p class="meta">확정 ${total - pend} · 확정 전 제안 ${pend} — 확정해야 할 일 탭에 보여요</p>${bar(Math.round((total - pend) / total * 100))}` : ''}</div>
          ${pend ? `<button class="btn primary small" data-action="sug-all">모두 확정</button>` : ''}</div>
        ${main.join('') || '<section class="sec"><p class="meta">이 회의에서 뽑은 할 일이 없어요. 필요하면 아래에서 직접 추가하세요.</p></section>'}
        ${addCard(m)}
        ${dels.length ? `<div class="sec-h"><h2>필요 없어 보이는 일</h2><span class="meta">따로 확인해요</span></div>${dels.join('')}` : ''}`;
    }

    /* ── 할 일(팀 전체, 확정된 것만, 사람별로 묶음) ── */
    // 할 일 한 줄: 제목 | 기한 · 상태 칩. 칩을 누르면 상태 네 가지 메뉴, 길게 누르면(우클릭도) 고치기
    function todoRow(t) {
      const [st, cls] = STATUS[t.status];
      const open = S.open === t.id, menu = open && S.openMode === 'more', edit = open && S.openMode === 'edit';
      const mine = t.owner === S.me, rk = riskOf(t); // 상태 칩·체크는 담당자만. 남의 일은 막힘만 제목 옆 뱃지로
      return `<li class="todo" data-done="${t.status === 'done'}">
        <div class="todo-head" data-press="${t.id}"><div class="todo-title"><button class="check" data-action="check" data-id="${t.id}" aria-label="${t.title} 완료 표시"${mine ? '' : ' disabled'}></button>
            <span class="name">${t.title}${rk === '늦음' || (rk === '막힘' && !mine) ? ` <span class="badge ${RISK_SEV[rk]}">${rk}</span>` : ''}</span></div>
          <div class="todo-right"><span class="meta num">${t.due}</span>
            ${mine ? `<button class="badge ${cls} st-chip" data-action="st-open" data-id="${t.id}" aria-haspopup="menu" aria-expanded="${menu}" aria-label="상태 ${st}, 눌러서 바꾸기">${st}</button>` : ''}
            ${menu ? `<div class="st-menu" role="menu">${Object.entries(STATUS).map(([k, [l, c]]) => `<button role="menuitemradio" aria-checked="${k === t.status}" data-action="status" data-v="${k}" data-id="${t.id}"><span class="badge ${c}">${l}</span></button>`).join('')}</div>` : ''}</div></div>
        ${!t.owner && !edit ? `<div class="todo-actions"><select class="field" data-action="edit" data-k="owner" data-id="${t.id}" aria-label="담당자 지정" style="min-height:32px;font-size:13px"><option value="">담당자 지정</option>${DATA.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}</select></div>` : ''}
        ${edit ? todoEdit(t) : ''}
      </li>`;
    }
    // 고치기(길게 누름): 제목 / 담당자·기한 / 출처 | 삭제(빨간 글자) · 수정
    function todoEdit(t) {
      const src = t.mtg ? `<button class="src" data-action="go-mtg" data-id="${t.mtg}">${t.src}</button>` : t.src;
      return `<div class="todo-panel edit"><input class="field" value="${t.title}" data-action="edit" data-k="title" data-id="${t.id}" aria-label="제목">
          <div class="edit-row"><select class="field" data-action="edit" data-k="owner" data-id="${t.id}" aria-label="담당자">${ownerOpts(t.owner)}</select>
            ${dueInput(`data-action="edit" data-k="due" data-id="${t.id}"`, t.due)}</div>
          <div class="panel-act"><span class="meta">출처 ${src}${t.autoDone ? ` · <button class="src" data-action="go-mtg" data-id="${t.autoDone}">회의에서 완료</button>` : ''}</span>
            <span class="btns"><button class="btn small del" data-action="del" data-id="${t.id}">삭제</button><button class="btn small primary" data-action="toggle" data-mode="edit" data-id="${t.id}">수정</button></span></div></div>`;
    }
    function tasks() {
      const all = tasksAll();
      if (!all.length) return `<section class="sec"><h2>아직 팀 할 일이 없어요</h2><p class="meta">회의 상세에서 할 일 제안을 확정하면 사람별로 여기에 모여요. 회의와 상관없는 일은 직접 추가해도 돼요.</p>
        <button class="btn block" data-action="go" data-to="schedule">일정으로 가기</button></section>${addCard(null)}`;
      // 사람별 남은 할 일 개수(모두 같은 색)
      const load = DATA.members.map(m => ({ m, n: all.filter(t => t.owner === m.id && t.status !== 'done').length }));
      const max = Math.max(1, ...load.map(l => l.n));
      const F = { '전체': () => true, '시작 전': t => t.status === 'todo', '진행 중': t => t.status === 'doing', '막힘': t => t.status === 'blocked', '완료': t => t.status === 'done' };
      const list = all.filter(F[S.filter]).sort((a, b) => (a.status === 'done') - (b.status === 'done') || dueN(a) - dueN(b));
      const order = [null, S.me, ...DATA.members.map(m => m.id).filter(id => id !== S.me)];
      const groups = order.map(id => [id, list.filter(t => t.owner === id)]).filter(([, l]) => l.length);
      const pend = pendingAll();
      return `<section class="sec"><h2>사람별 남은 할 일</h2>
          ${load.map(l => `<div class="load"><span>${l.m.name}</span>${bar(Math.round(l.n / max * 100))}<span class="num meta">${l.n}개</span></div>`).join('')}</section>
        ${pend ? `<div class="hint"><span>회의록에 확정 전 할 일 제안 <b class="num">${pend}</b>개가 있어요. 확정하면 여기에 들어와요.</span><button class="link sm" data-action="go" data-to="schedule">일정</button></div>` : ''}
        ${addCard(null)}
        <div class="chips">${Object.keys(F).map(k => `<button class="chip" data-action="filter" data-f="${k}" aria-pressed="${S.filter === k}">${k}</button>`).join('')}</div>
        <p class="meta todo-guide">길게 누르면 고치기</p>
        ${groups.map(([id, l]) => `<section class="sec"><span class="cat" style="margin-top:0">${id ? `${nameOf(id)}${id === S.me ? ' (나)' : ''}` : '담당자 없음'} <span class="n num">${l.length}</span></span>
          <ul class="todos">${l.map(todoRow).join('')}</ul></section>`).join('')}
        ${!list.length ? `<section class="sec"><p>조건에 맞는 할 일이 없어요.</p><button class="btn block" data-action="filter" data-f="전체">전체 보기</button></section>` : ''}`;
    }

    /* ── 나 ── */
    const WD = ['월', '화', '수', '목', '금', '토', '일'];
    const BLK_K = { class: '수업', busy: '일정' };
    function weekGrid() {
      const blocks = DATA.week.map((b, i) => ({ ...b, i }));
      const mt = meet(), [ms, me] = mt.time.split('–').map(x => parseInt(x, 10));
      if (S.week === 'next' && S.meeting !== 'none') blocks.push({ d: WD.indexOf(mt.wd), s: ms, e: me, k: S.meeting === 'confirmed' ? 'meet' : 'wait', label: S.meeting === 'confirmed' ? '팀 회의' : '회의 대기' });
      const pos = (s, e) => `top:${(s - 9) / 12 * 100}%;height:${(e - s) / 12 * 100}%`;
      return `<div class="week"><span></span>${WD.map(w => `<span class="wd">${w}</span>`).join('')}
        <div class="hours">${[9, 12, 15, 18, 21].map(h => `<span style="top:${(h - 9) / 12 * 100}%">${h}</span>`).join('')}</div>
        ${[0, 1, 2, 3, 4, 5, 6].map(d => `<div class="col">${blocks.filter(b => b.d === d).map(b => b.i == null ? `<span class="blk" data-k="${b.k}" style="${pos(b.s, b.e)}">${b.label}</span>`
          : `<button class="blk" data-k="${b.k}" data-action="blk-edit" data-i="${b.i}" data-sel="${S.grp.includes(b.i)}" style="${pos(b.s, b.e)}" aria-label="${WD[b.d]} ${b.s}–${b.e}시 ${b.label} 고치기">${b.label}</button>`).join('')}</div>`).join('')}</div>
        <div class="wlegend"><span><i style="background:color-mix(in srgb,var(--text) 14%,var(--card))"></i>수업</span><span><i style="background:var(--sub-soft)"></i>일정</span>
          <span><i style="background:var(--point)"></i>팀 회의</span></div>`;
    }
    // 내 일정 추가·고치기(매주 반복). 이름·종류가 같은 칸을 한 일정으로 묶고 요일마다 시간을 따로 둔다. 캘린더에서 온 약속은 캘린더에서 고친다
    function blkForm() {
      const b = S.draft, isNew = S.blk === 'new';
      const hrs = sel => Array.from({ length: 13 }, (_, i) => i + 9).map(h => `<option value="${h}"${h === sel ? ' selected' : ''}>${h}:00</option>`).join('');
      const days = Object.keys(b.days).map(Number).sort();
      return `<div class="blk-form" id="blk-form"><p class="strong">${isNew ? '일정 추가' : '일정 고치기'}</p>
          <label class="field-l" style="margin-top:6px">이름 (나만 보여요)<input class="field" value="${b.label}" data-action="draft" maxlength="20"></label>
          <span class="field-l">종류</span><div class="seg k2">${Object.entries(BLK_K).map(([k, v]) => `<button data-action="draft-k" data-k="k" data-v="${k}" aria-pressed="${b.k === k}">${v}</button>`).join('')}</div>
          <span class="field-l">요일 (매주 반복 · 여러 개 고를 수 있어요)</span><div class="seg">${WD.map((w, d) => `<button data-action="draft-day" data-v="${d}" aria-pressed="${d in b.days}">${w}</button>`).join('')}</div>
          <span class="field-l">시간 (요일마다 달라도 돼요)</span>
          ${days.map(d => `<div class="day-t"><b>${WD[d]}</b><div class="range"><select class="field" data-action="draft-t" data-d="${d}" data-i="0" aria-label="${WD[d]} 시작">${hrs(b.days[d][0])}</select><span>–</span><select class="field" data-action="draft-t" data-d="${d}" data-i="1" aria-label="${WD[d]} 끝">${hrs(b.days[d][1])}</select></div></div>`).join('')}
          <div class="panel-act">${isNew ? '<span></span>' : '<button class="btn small del" data-action="blk-del">삭제</button>'}
            <span style="display:flex;gap:6px"><button class="btn small" data-action="blk-cancel">취소</button><button class="btn small primary" data-action="blk-save">저장</button></span></div></div>`;
    }
    const linkAct = l => l.act === '켜짐' ? '<span class="badge ok">켜짐</span>'
      : l.ic === 'link' ? `<button class="pill" data-action="toast" data-msg="에브리타임에서 수업 4개를 다시 불러왔어요">${l.act}</button>`
      : `<button class="pill" data-action="blk-edit" data-i="${DATA.week.findIndex(b => b.src === 'self')}">${l.act}</button>`;
    function me() {
      const my = member(S.me);
      // 에이전트 말: 고치기를 누르면 문장을 직접 고친다(저장하면 조율에서 이 문장으로 말함)
      const quote = S.quoteEdit
        ? `<div class="quote"><p class="meta">내 에이전트가 이렇게 말해 줘요</p>
            <textarea class="field" id="quote-in" maxlength="200" aria-label="에이전트가 할 말">${quotePlain()}</textarea>
            <div class="panel-act"><button class="btn small quiet" data-action="quote-cancel">취소</button><button class="btn small primary" data-action="quote-save">저장</button></div></div>`
        : `<div class="quote"><div class="row-between"><p class="meta">내 에이전트가 이렇게 말해 줘요</p><span>${S.quote ? '<button class="link sm" data-action="quote-reset">원래대로</button>' : ''}<button class="link sm" data-action="quote-edit">고치기</button></span></div><p>${myQuote()}</p></div>`;
      return `
        <div class="profile">${av(S.me)}<div class="who"><b>${my.name}</b> ${isLeader() ? '<span class="badge here">팀장</span>' : ''}<p class="meta">${P.name}</p></div></div>
        ${quote}
        <section class="sec"><div class="row-between"><h2 style="margin:0">내 일정 가져오기</h2><span class="meta sync">${S.synced ? '방금' : '10분 전'} 확인<button class="icon-btn" data-action="sync" aria-label="일정 다시 확인">${ic('repeat', '')}</button></span></div>
          ${DATA.links.map(l => `<div class="link-row"><span class="ic">${ic(l.ic, '')}</span><div><p class="strong" style="font-size:14px">${l.name}</p><p class="meta">${l.desc}</p></div>
            ${linkAct(l)}</div>`).join('')}
          <div class="lock">${ic('lock')}<span>팀원에게는 <b>바쁨 / 비어 있음</b>만 보여요. 약속 이름은 아무도 못 봐요.</span></div></section>
        <section class="sec"><div class="row-between"><h2 style="margin:0">내 시간 <span class="meta num" style="font-weight:400">${S.week === 'this' ? '11/9–11/15' : '11/16–11/22'}</span></h2>
            <div class="seg-s"><button data-action="week" data-v="this" aria-pressed="${S.week === 'this'}">이번 주</button><button data-action="week" data-v="next" aria-pressed="${S.week === 'next'}">다음 주</button></div></div>
          <p class="meta">칸을 누르면 고쳐요</p>
          ${weekGrid()}
          ${S.blk === null ? '<button class="btn small dashed block" data-action="blk-new">+ 일정 추가 (수업 · 알바 · 약속 같은 개인 일정)</button>' : blkForm()}</section>
        <section class="sec"><h2>내가 좋아하는 방식</h2>${prefForm()}</section>
        <section class="sec"><h2>팀원 양보 점수</h2>${DATA.members.map(m => `<div class="list-row"><div style="display:flex;gap:10px;align-items:center">${av(m.id)}<p class="strong">${m.name}${m.id === S.me ? ' (나)' : ''}</p></div>
            <span class="yield-val">${YIELD[m.yield]} ${steps(m.yield)}</span></div>`).join('')}
          <p class="meta" style="margin-top:6px">회의마다 누가 맞춰 줬는지는 알림의 양보 기록에서 봐요.</p>
          <button class="btn small block" data-action="toast" data-msg="초대 코드 ${P.code}를 복사했어요">팀원 초대</button></section>`;
    }

    const bell = () => { const n = unread();
      return `<button class="icon-btn" data-action="go" data-to="alerts" aria-label="알림 ${n}개"><svg class="i" viewBox="0 0 24 24">${ICON.bell}</svg>${n ? `<span class="count num">${n}</span>` : ''}</button>`; };
    const SCREENS = {
      welcome: { title: () => '', render: welcome },
      create: { title: () => '방 생성하기', back: 'welcome', render: create },
      join: { title: () => '초대 코드로 들어가기', back: 'welcome', render: join },
      ob: { title: () => '내 조건 알려 주기', render: ob },
      home: { title: () => '서비스디자인 팀플', tab: 'home', render: home, aux: bell },
      alerts: { title: () => '알림', tab: 'home', back: 'home', render: alerts, aux: () => S.read ? '' : '<button class="link sm" data-action="read" style="padding:0 8px">모두 읽음</button>' },
      // 회의 잡기·조율 화면은 들어온 탭(홈 또는 일정)으로 돌아간다
      newmeet: { title: () => '회의 잡기', tab: () => S.from, back: () => S.from, render: newmeet },
      negotiate: { title: () => '조율 과정', tab: () => S.from, back: () => S.from, render: negotiate },
      proposal: { title: () => '조율 결과', tab: () => S.from, back: () => S.from, render: proposal },
      schedule: { title: () => '일정', tab: 'schedule', render: schedule, aux: () => `<span class="meta num" style="padding-right:8px">10/13 – 12/11</span>` },
      meeting: { title: () => '회의록', tab: 'schedule', back: 'schedule', render: meetingDetail },
      tasks: { title: () => '팀 할 일', tab: 'tasks', render: tasks },
      me: { title: () => '나', tab: 'me', render: me }
    };

    const val = v => (typeof v === 'function' ? v() : v);
    function render(keepScroll) {
      const sc = SCREENS[S.screen], view = $('#view'), y = view.scrollTop;
      $('#title').textContent = sc.title();
      $('#back').hidden = !sc.back;
      $('#aux').innerHTML = sc.aux ? sc.aux() : '';
      FULL.includes(S.screen) ? $('.app').setAttribute('data-full', '') : $('.app').removeAttribute('data-full');
      view.innerHTML = sc.render();
      const cta = view.querySelector(':scope > .cta'); $('#dock').replaceChildren(...(cta ? [cta] : []));
      view.scrollTop = keepScroll ? y : 0;
      document.querySelectorAll('.tab').forEach(t => t.dataset.to === val(sc.tab) ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
      const pend = pendingAll();
      $('#pending').textContent = pend; $('#pending').hidden = !pend;
      $('#me-btns').innerHTML = DATA.members.map(m => `<button data-action="me" data-id="${m.id}" aria-pressed="${m.id === S.me}">${m.name} · ${m.id === DATA.leader ? '팀장' : '팀원'}</button>`).join('');
      document.querySelectorAll('[data-action="state"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.mock));
      $('#clock-btn').textContent = S.clock ? '시계: 11/10 화 09:00으로' : '시계: 11/18 수 15:30으로';
      const lv = $('#live'); if (lv) lv.scrollTop = lv.scrollHeight;
      if (S.scrollTo) { document.getElementById(S.scrollTo)?.scrollIntoView({ block: 'center' }); S.scrollTo = null; }
    }
    function go(to) {
      clearInterval(timer);
      if (to === 'negotiate' && S.talk === 'play' && !talkDone()) S.shown = 0;
      if (to === 'create') S.made = 'form';
      if (to === 'proposal') S.coord = false;
      if (S.screen === 'home' || S.screen === 'schedule') S.from = S.screen;
      S.screen = to; render();
      if (to === 'negotiate') play();
    }
    // 시연 장치: 상태 버튼 하나 = 화면 + 데이터 상태 묶음
    function setState(v) {
      S.mock = v; S.adhoc = false; S.rec = 'idle';
      if (v === 'welcome') return go('welcome');
      if (v === 'ob') { obReset(); return go('ob'); }
      if (v === 'linkfail') { obReset(); S.ob = 1; S.et = { url: 'everytime.kr/timetable/2026/2', st: 'fail' }; return go('ob'); }
      S.fresh = v === 'fresh'; if (S.fresh || v === 'newmeet' || v === 'fail' || v === 'none') S.me = DATA.leader;
      if (v === 'failm' || v === 'nonem') { v = v.slice(0, -1); S.me = 'minji'; }
      S.meeting = v === 'nomeeting' || v === 'fresh' ? 'none' : S.meeting === 'none' ? 'proposed' : S.meeting;
      S.noTasks = v === 'notasks'; S.quiet = v === 'quiet'; S.read = false;
      if (S.quiet) { S.meeting = 'confirmed'; DATA.members.forEach(x => { S.resp[x.id] = '수락'; }); }
      S.talk = v === 'fail' || v === 'none' ? v : 'play';
      // 11/5: 조정은 그 자리에서 확정되므로 조율이 끝난 상태다. 조율 중 칸이
      // 아니라 잡힌 회의로 가야 한다(예전엔 팀장이 고를 때까지 조율 중이었다).
      S.coord = false;
      // 11/5: 사람이 고르지 않으므로 화면에 들어오는 순간 이미 정해져 있다.
      // fail은 후보 중 두 번째(현우가 많이 맞춰 주는 안) — 양보 차등이 보이는 쪽이다.
      S.pick = v === 'fail' ? 1 : v === 'none' ? 0 : null;
      DATA.members.forEach(x => { S.resp[x.id] ??= '대기'; }); // 불참안 뒤에도 응답자 네 명으로 되돌림
      // 조정은 수락·거절 없이 확정된다. 오는 사람은 수락으로 깔린다(시스템이 대신 수락).
      if (S.pick != null) { S.meeting = 'confirmed'; S.resp = Object.fromEntries(voters().map(x => [x.id, '수락'])); }
      S.recorded = v !== 'norec' && v !== 'live' && v !== 'aifail'; S.add = null;
      if (v === 'aifail') { S.mtg = 'm3'; S.rec = 'fail'; }
      // 받아적는 중: 세 줄쯤 받아적힌 상태에서 시작
      if (v === 'live') { const L = DATA.meetings[0].lines; S.mtg = 'm3'; S.rec = 'live'; S.recAt = Date.now() - 3 * LIVE_MS; S.live = L.slice(0, 3); }

    }
    // 전원이 수락하면 따로 누르지 않아도 바로 확정하고 모두에게 알린다
    function autoConfirm() {
      if (S.meeting === 'confirmed' || accepted() < voters().length) return false;
      const m = meet(), g = member(m.gets);
      S.meeting = 'confirmed'; g.base ??= g.yield; g.yield = Math.min(g.base + 1, 2);
      DATA.history.unshift({ date: `${m.date.split(' ').slice(0, 2).join(' ')} 회의`, who: m.gets, why: m.hist || '수업 바로 뒤지만 현우를 먼저 챙기려고 맞춰 줬어요.' });

      toast('모두 수락해서 회의가 확정됐어요');
      return true;
    }
    const sugOf = el => { const m = DATA.meetings.find(x => x.id === el.dataset.m); return [m, m.sugs[+el.dataset.i]]; };
    function confirmSug(s) {
      const t = DATA.tasks.find(x => x.id === s.task);
      t.ai = false; t.by = S.me;
    }

    /* ── 이벤트 위임 ── */
    document.addEventListener('click', async e => {
      if (longPressed) { longPressed = false; return; } // 길게 누른 뒤 손 뗄 때의 클릭은 무시
      if (S.open && S.openMode === 'more' && !e.target.closest('.st-menu, .st-chip')) { S.open = null; render(true); } // 상태 메뉴 바깥 누름 = 닫기
      const el = e.target.closest('[data-action]');
      if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
      const a = el.dataset.action, id = el.dataset.id, task = DATA.tasks.find(t => t.id === id);
      if (a === 'state') setState(el.dataset.v);
      else if (a === 'me') { S.me = id; render(true); }
      else if (a === 'tab' || a === 'go') go(el.dataset.to);
      else if (a === 'back') go(val(SCREENS[S.screen].back));
      else if (a === 'to-result') { if (S.talk === 'play') S.shown = DATA.talk.length; go('proposal'); }
      else if (a === 'replay-view') { S.shown = 0; render(); play(); }
      else if (a === 'replay') { S.talk = 'play'; S.pick = null; S.shown = 0; S.coord = true; S.resp[S.me] = '대기'; go('negotiate'); }
      // 11/5: 'pick' 동작을 없앴다. 사람이 후보를 고르는 단계가 사라져서 부를 데가 없다.
      else if (a === '__removed_pick') {
        S.pick = +el.dataset.i; S.meeting = 'proposed';
        S.resp = Object.fromEntries(voters().map(x => [x.id, '대기']));
        go('proposal'); toast('고른 안을 팀원에게 보냈어요');
      }
      else if (a === 'toast') toast(el.dataset.msg);
      // 처음 들어오기
      else if (a === 'room-size') { S.room.size = +el.dataset.v; render(true); }
      else if (a === 'room-make') {
        if (await ask({ title: '방을 만들까요?', body: `'${S.room.name}' 방을 만들어요. 만든 사람이 팀장이 되고, 회의 잡기를 맡아요.`, ok: '방 만들기', irreversible: false })) {
          S.made = 'done'; S.me = DATA.leader; S.fresh = true; S.meeting = 'none'; render();
        }
      }
      else if (a === 'join-ok') { if (S.me === DATA.leader) S.me = 'minji'; obReset(); go('ob'); }
      else if (a === 'ob-start') { obReset(); go('ob'); }
      else if (a === 'ob-next') { S.ob = Math.min(S.ob + 1, 2); S.blk = null; render(); }
      else if (a === 'ob-prev') { S.ob = Math.max(S.ob - 1, 0); S.blk = null; render(); }
      else if (a === 'ob-done') { go('home'); toast('내 에이전트가 준비됐어요'); }
      // 에브리타임 공유 링크: everytime.kr/@아이디 꼴만 읽힌다(시연용)
      else if (a === 'et-load') {
        if (!/everytime\.kr\/@[\w.-]+/.test(S.et.url)) { S.et.st = 'fail'; return render(true); }
        S.et.st = 'reading'; render(true);
        setTimeout(() => { S.et.st = 'ok'; if (S.screen === 'ob') render(true); }, 900);
      }
      else if (a === 'gcal') { S.gcal = true; render(true); toast('구글 캘린더를 연결했어요. 개인 약속 6개를 가져왔어요'); }
      // 회의 잡기
      else if (a === 'nm-len') { S.nm.len = Math.min(240, Math.max(30, S.nm.len + +el.dataset.v)); render(true); }
      else if (a === 'nm-mode') { S.nm.mode = el.dataset.v; render(true); }
      else if (a === 'nm-start') {
        if (await ask({ title: '조율을 시작할까요?', body: `'${S.nm.title}' 회의를 팀원 ${DATA.members.length}명의 에이전트가 조율해요. 결과가 나오면 모두에게 알림이 가요.`, ok: '조율 시작', irreversible: false })) {
          DATA.meeting.title = S.nm.title.trim() || DATA.meeting.title;
          S.meeting = 'proposed'; S.talk = 'play'; S.shown = 0; S.fresh = false; S.fb = null; S.coord = true;
          S.resp = { jisu: '대기', minji: '대기', hyunwoo: '대기', seoyeon: '대기' };
          go('negotiate');
        }
      }
      // 조율 결과
      else if (a === 'accept') {
        const say = await ask({ title: '이 시간으로 수락할까요?', body: '이 시간이 어떤지 한 줄 남기면 내 에이전트가 다음 회의부터 참고해요. 비워 둬도 돼요.', ok: '수락하기', irreversible: false, input: '예: 수업 바로 뒤라 조금 빠듯해요', label: '이 시간 어때요' });
        if (!say) return;
        feedback(say); S.resp[S.me] = '수락';
        if (!autoConfirm()) { render(true); if (S.fb?.change) toast('수락했어요. 남긴 말은 다음 회의부터 참고해요'); }
        const wait = Object.keys(S.resp).filter(k => S.resp[k] === '대기');
        wait.forEach((w, k) => setTimeout(() => { S.resp[w] = '수락'; if (!autoConfirm()) toast(`${nameOf(w)}가 방금 수락했어요`); if (S.screen === 'proposal') render(true); }, 1500 * (k + 1)));
      }
      else if (a === 'reject') {
        const why = await ask({ title: '조율 결과를 거절할까요?', body: '이유를 한 줄 남기면 판단 에이전트가 다음 라운드에 반영하고, 내 에이전트도 다음 회의부터 참고해요. 비워 둬도 돼요.', ok: '거절하기', irreversible: false, input: '예: 금요일은 역시 힘들어요' });
        if (why) { feedback(why); S.resp[S.me] = '거절'; render(true); toast('거절을 전달했어요'); }
      }
      else if (a === 'fb-undo') { S.fb.undone = true; render(true); toast('선호를 되돌렸어요'); }
      // 할 일
      else if (a === 'toggle') { const m = el.dataset.mode; S.open = S.open === id && S.openMode === m ? null : id; S.openMode = m; render(true); }
      else if (a === 'st-open') {
        if (task.owner !== S.me) return toast(task.owner ? `상태는 ${nameOf(task.owner)}만 바꿀 수 있어요` : '담당자를 정하면 상태를 바꿀 수 있어요');
        S.open = S.open === id && S.openMode === 'more' ? null : id; S.openMode = 'more'; render(true);
      }
      else if (a === 'status') {
        const v = el.dataset.v; S.open = null;
        if (v === 'blocked' && task.status !== 'blocked') {
          const why = await ask({ title: '막힘으로 바꿀까요?', body: '팀에 바로 알려요. 막힌 이유를 한 줄 남기면 알림에 같이 보여요. 비워 둬도 돼요.', ok: '막힘으로 바꾸기', irreversible: false, input: '예: 인터뷰 녹취가 아직 안 왔어요', label: '막힌 이유' });
          if (!why) return render(true);
          task.note = typeof why === 'string' ? why.trim() : '';
        }
        if (v !== 'blocked') task.note = '';
        task.status = v; if (v !== 'done') task.autoDone = null;
        render(true); if (v === 'blocked') toast('막혔다고 팀에 알렸어요');
      }
      else if (a === 'check') {
        if (task.owner !== S.me) return toast(`${task.owner ? nameOf(task.owner) + '의' : '담당자 없는'} 할 일은 담당자만 완료할 수 있어요`);
        task.status = task.status === 'done' ? 'todo' : 'done'; if (task.status !== 'done') task.autoDone = null; render(true);
      }
      else if (a === 'del') {
        if (await ask({ title: '이 할 일을 삭제할까요?', body: `'${task.title}'을 할 일에서 삭제해요. ${task.owner ? nameOf(task.owner) + '의 ' : ''}내 할 일에서도 사라져요.`, ok: '삭제', danger: true })) {
          DATA.tasks.splice(DATA.tasks.indexOf(task), 1); S.open = null; render(true); toast('할 일을 삭제했어요');
        }
      }
      else if (a === 'filter') { S.filter = el.dataset.f; render(true); }
      else if (a === 'read') { S.read = true; render(true); }
      else if (a === 'clock') { S.clock = !S.clock; if (S.clock && S.meeting !== 'confirmed') toast('회의를 확정해야 30분 전 알림이 떠요'); render(true); }
      // 회의록
      else if (a === 'rec') {
        S.rec = el.dataset.to;
        if (S.rec === 'live') { S.recAt = Date.now(); S.live = []; }
        if (S.rec === 'work') setTimeout(() => { S.rec = 'idle'; S.recorded = true; S.mtg = 'm3'; S.raw = false;
          if (S.screen === 'meeting') render(); toast('할 일 제안 4개를 만들고, 끝난 일 1개를 완료로 바꿨어요'); }, 1800);
        render(true);
      }
      else if (a === 'go-mtg') { S.mtg = id; S.raw = false; S.add = null; go('meeting'); }
      // 지금 회의 기록하기: 오늘 잡힌 회의가 있으면 거기에 붙고, 없으면 주제 한 줄(선택)만 받고 바로 시작
      else if (a === 'rec-now') {
        if (S.recorded) {
          const topic = await ask({ title: '지금 회의를 기록할까요?', body: '잡힌 회의가 없어도 바로 시작해요. 끝나면 지난 회의 목록에 들어가요.', ok: '기록 시작', irreversible: false, input: '주제 한 줄 (비워 둬도 돼요)', label: '회의 주제' });
          if (!topic) return;
          if (typeof topic === 'string' && topic.trim()) DATA.meetings[0].topic = topic.trim();
          S.recorded = false; S.adhoc = true;
        }
        S.mtg = 'm3'; S.rec = 'idle'; go('meeting');
      }
      else if (a === 'raw') { S.raw = !S.raw; render(true); }
      else if (a === 'auto-toggle') {
        const [m, s] = sugOf(el), t = DATA.tasks.find(x => x.id === s.task), back = s.state !== 'undone';
        s.state = back ? 'undone' : 'done'; t.status = back ? 'doing' : 'done'; t.autoDone = back ? null : m.id;
        render(true); toast(back ? '진행 중으로 되돌렸어요' : '다시 완료로 바꿨어요');
      }
      else if (a === 'sug-ok') { const [, s] = sugOf(el); confirmSug(s); render(true); toast(`확정했어요. 이제 할 일 탭에 보여요`); }
      else if (a === 'sug-all') {
        const m = DATA.meetings.find(x => x.id === S.mtg), list = m.sugs.filter(s => counted(s) && isPending(s));
        if (await ask({ title: `할 일 ${list.length}개를 모두 확정할까요?`, body: `확정하면 할 일 탭에 들어가요. 담당자가 비어 있는 것은 담당자 없음으로 확정돼요. 확정한 사람은 ${nameOf(S.me)}로 남아요.`, ok: '모두 확정', irreversible: false })) {
          list.forEach(confirmSug); render(true); toast(`${list.length}개를 확정했어요`);
        }
      }
      else if (a === 'sug-drop') {
        const [, s] = sugOf(el), t = DATA.tasks.find(x => x.id === s.task);
        if (await ask({ title: '이 제안을 삭제할까요?', body: `'${t.title}' 제안을 삭제해요. 할 일로 등록되지 않아요.`, ok: '삭제', danger: true })) {
          DATA.tasks.splice(DATA.tasks.indexOf(t), 1); s.state = 'deleted'; render(true);
        }
      }
      else if (a === 'add-open') { S.add = id; S.addDraft = { title: '', owner: '', due: '' }; render(true); }
      else if (a === 'add-cancel') { S.add = null; render(true); }
      else if (a === 'add-ok') {
        const d = S.addDraft, m = DATA.meetings.find(x => x.id === id);
        if (!d.title.trim()) return toast('할 일 제목을 적어 주세요');
        if (!d.due) return toast('기한을 골라 주세요');
        const t = { id: 'u' + Date.now(), title: d.title.trim(), owner: d.owner || null, due: d.due, status: 'todo', src: m ? `${m.date} 회의` : '직접 추가', mtg: m?.id, by: S.me };
        DATA.tasks.push(t); if (m) m.sugs.push({ kind: 'new', task: t.id }); else S.filter = '전체';
        S.add = null; render(true); toast(m ? '추가했어요. 할 일 탭에 바로 보여요' : '할 일을 추가했어요');
      }
      else if (a === 'sug-keep') { const [, s] = sugOf(el); s.state = 'kept'; render(true); toast('할 일을 그대로 두었어요'); }
      else if (a === 'sug-del') {
        const [, s] = sugOf(el), t = DATA.tasks.find(x => x.id === s.task);
        if (await ask({ title: '이 할 일을 삭제할까요?', body: `'${t.title}'(${nameOf(t.owner)} 담당)을 할 일에서 삭제해요. ${nameOf(t.owner)}의 내 할 일에서도 사라져요.`, ok: '삭제', danger: true })) {
          DATA.tasks.splice(DATA.tasks.indexOf(t), 1); s.state = 'deleted'; render(true);
        }
      }
      // 나
      else if (a === 'pref') { S.pref[el.dataset.k] = el.dataset.v; S.quote = null; render(true); }
      else if (a === 'pref-when') { const v = el.dataset.v, w = S.pref.when;
        if (w.includes(v) && w.length === 1) return toast('하나는 골라야 해요');
        S.pref.when = WHEN.filter(o => o === v ? !w.includes(v) : w.includes(o)); S.quote = null; render(true); }
      else if (a === 'week') { S.week = el.dataset.v; render(true); }
      else if (a === 'quote-edit') { S.quoteEdit = true; render(true); }
      else if (a === 'quote-cancel') { S.quoteEdit = false; render(true); }
      else if (a === 'quote-reset') { S.quote = null; render(true); toast('조건으로 만든 원래 문장으로 돌렸어요'); }
      else if (a === 'sync') { S.synced = true; render(true); toast('에브리타임·구글 캘린더 일정을 다시 확인했어요'); }
      else if (a === 'quote-save') {
        const v = document.getElementById('quote-in').value.trim().replace(/[“”]/g, '');
        if (!v) return toast('에이전트가 할 말을 한 줄은 써 주세요');
        S.quote = v; S.quoteEdit = false; render(true); toast('저장했어요. 다음 조율부터 이 문장으로 말해요');
      }
      else if (a === 'blk-new') { S.blk = 'new'; S.grp = []; S.draft = { k: 'busy', label: '', src: 'self', days: { 0: [18, 20] } }; S.scrollTo = 'blk-form'; render(true); }
      else if (a === 'blk-edit') {
        const b = DATA.week[+el.dataset.i];
        if (b.src === 'cal') return toast('구글 캘린더 약속은 캘린더에서 고쳐요. 이름은 팀원에게 안 보여요');
        S.grp = DATA.week.map((w, j) => j).filter(j => { const w = DATA.week[j]; return w.label === b.label && w.k === b.k && w.src === b.src; });
        S.blk = +el.dataset.i; S.draft = { k: b.k, label: b.label, src: b.src, days: Object.fromEntries(S.grp.map(j => [DATA.week[j].d, [DATA.week[j].s, DATA.week[j].e]])) };

      else if (a === 'draft-k') { S.draft[el.dataset.k] = el.dataset.v; render(true); }

        toast(isNew ? `매주 ${days.map(d => WD[d]).join('·')}요일에 넣었어요. 에이전트가 이 시간은 빼고 조율해요` : '일정을 고쳤어요');
      }
      else if (a === 'blk-del') {
        const b = S.draft, days = Object.keys(b.days).map(Number).sort();
        if (await ask({ title: '이 일정을 삭제할까요?', body: `매주 ${days.map(d => `${WD[d]} ${b.days[d][0]}–${b.days[d][1]}시`).join(', ')} '${b.label}'을 내 시간에서 삭제해요. 다음 조율부터 이 시간은 비어 있는 것으로 봐요.`, ok: '삭제', danger: true })) {
          [...S.grp].sort((x, y) => y - x).forEach(j => DATA.week.splice(j, 1)); S.blk = null; S.grp = []; render(true); toast('일정을 삭제했어요');
        }
      }
    });
    // 할 일 길게 누름(0.5초) = 고치기. 노트북 시연을 위해 마우스 길게 누름과 우클릭도 같은 동작
    let pressTimer = null, longPressed = false;
    const openEdit = id => { S.open = id; S.openMode = 'edit'; render(true); };
    document.addEventListener('pointerdown', e => {
      longPressed = false; const h = e.target.closest?.('[data-press]'); if (!h || e.button !== 0) return;
      pressTimer = setTimeout(() => { longPressed = true; openEdit(h.dataset.press); }, 500);
    });
    ['pointerup', 'pointercancel', 'scroll'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressTimer), true));
    document.addEventListener('contextmenu', e => { const h = e.target.closest('[data-press]'); if (h) { e.preventDefault(); clearTimeout(pressTimer); openEdit(h.dataset.press); } });
    // 글자 칸은 다시 그리지 않고 값만 담는다(바로 옆 버튼 누름이 끊기지 않게)
    document.addEventListener('input', e => {
      const el = e.target.closest('[data-action]'); if (!el) return;
      if (el.dataset.action === 'et-url') S.et.url = el.value.trim();
      else if (el.dataset.action === 'add-f') S.addDraft[el.dataset.k] = el.dataset.k === 'due' ? dueOf(el.value) : el.value;
      else if (el.dataset.action === 'pref-avoid') { S.pref.avoid = el.value.trim(); S.quote = null; }
    });
    document.addEventListener('change', e => {
      const el = e.target.closest('[data-action]'); if (!el) return;
      const a = el.dataset.action, task = DATA.tasks.find(t => t.id === el.dataset.id);
      if (a === 'et-url' || a === 'pref-avoid' || a === 'add-f') return;      if (a === 'edit') {
        const k = el.dataset.k;
        if (k === 'owner') { task.owner = el.value || null; if (el.value) toast(`${nameOf(el.value)}에게 맡겼어요${task.ai ? '. 확정은 아직이에요' : ''}`); }
        else task[k] = (k === 'due' ? dueOf(el.value) : el.value.trim()) || task[k];
      }
      else if (a === 'draft') { S.draft.label = el.value; return; }
      else if (a === 'draft-t') { S.draft.days[el.dataset.d][+el.dataset.i] = +el.value; return; }
      else if (a === 'pref-sel') { S.pref[el.dataset.k] = +el.value; S.quote = null; }
      else if (a === 'room') S.room[el.dataset.k] = el.value;
      else if (a === 'nm') S.nm[el.dataset.k] = el.value;
      render(true);
    });
    setInterval(() => {
      const t = $('#tick'); if (t) t.textContent = countdown();
      const r = $('#rec-clock'); if (r) { const s = Math.floor((Date.now() - S.recAt) / 1000); r.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
      // 받아적는 중(시연용): LIVE_MS마다 한 줄씩 쌓인다
      const L = DATA.meetings[0].lines, lv = $('#live');
      if (S.rec === 'live' && lv && S.live.length < Math.min(L.length, Math.floor((Date.now() - S.recAt) / LIVE_MS))) {
        S.live.push(L[S.live.length]);
        lv.innerHTML = liveLines(); lv.scrollTop = lv.scrollHeight;
      }
    }, 1000);

    render();
  </script>
</body>
</html>
